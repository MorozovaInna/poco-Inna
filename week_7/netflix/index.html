<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <title>Netflix</title>
  </head>
  <body>
    <header>
      <nav>
        <img id="logo" src="netflix_logo.svg" alt="Netflix" />
        <div class="right-nav">
          <select id="select">
            <option lang="en" label="English" value="en-CH" selected="">English</option>
            <option lang="de" label="Deutsch" value="de-CH">Deutsch</option>
            <option lang="fr" label="Français" value="fr-CH">Français</option>
          </select>
          <button id="signIn">Sign In</button>
        </div>
      </nav>
    </header>
    <main>
      <section>
        <div class="content">
          <h1>
            Unlimited movies, TV <br />
            shows, and more.
          </h1>
          <p class="highlight">Watch anywhere. Cancel anytime.</p>
          <p>Ready to watch? Enter your email to create or restart your membership.</p>
          <form>
            <label for="email"></label>
            <input type="email" id="email" name="email" placeholder="Email address" />
            <button type="submit">Get started &gt;</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
